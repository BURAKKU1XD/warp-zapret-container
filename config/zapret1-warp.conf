# zapret-discord-youtube 1.10.4: general (ALT12).bat.
# Перенесены семь основных профилей winws -> nfqws с сохранением порядка.
# Game Filter выключен, как в исходном архиве (game_filter.enabled отсутствует).
NFQUEUE_NUM="200"

# Аналог Windows --wf-tcp / --wf-udp, но для Linux container OUTPUT.
NFQWS_PORTS_TCP="80,443,2053,2083,2087,2096,8443"
NFQWS_PORTS_UDP="443,19294:19344,50000:50100"

# Сохраняем существующие границы перехвата пакетов для WARP.
NFQWS_TCP_CONNBYTES="1:40"
NFQWS_UDP_CONNBYTES="1:12"

LISTS="/config/lists"
FAKE="/opt/zapret/files/fake"

NFQWS_ARGS=(
  # 1. UDP 443 по hostlist general/cloudflare/discord
  --filter-udp=443
  --hostlist="$LISTS/list-general.txt"
  --hostlist="$LISTS/list-general-user.txt"
  --hostlist-exclude="$LISTS/list-exclude.txt"
  --hostlist-exclude="$LISTS/list-exclude-user.txt"
  --ipset-exclude="$LISTS/ipset-exclude.txt"
  --ipset-exclude="$LISTS/ipset-exclude-user.txt"
  --dpi-desync=fake
  --dpi-desync-repeats=11
  --dpi-desync-fake-quic="$FAKE/quic_initial_www_google_com.bin"

  --new

  # 2. Discord/STUN UDP
  --filter-udp=19294-19344,50000-50100
  --filter-l7=discord,stun
  --dpi-desync=fake
  --dpi-desync-fake-discord="$FAKE/stun.bin"
  --dpi-desync-fake-discord="$FAKE/ACTIVE_DISCORD_UDP.bin"
  --dpi-desync-fake-stun="$FAKE/ACTIVE_DISCORD_UDP.bin"
  --dpi-desync-repeats=3

  --new

  # 3. TCP alt ports discord.media
  --filter-tcp=2053,2083,2087,2096,8443
  --hostlist-domains=discord.media
  --dpi-desync=fake,multisplit
  --dpi-desync-split-seqovl=681
  --dpi-desync-split-pos=1
  --dpi-desync-fooling=ts
  --dpi-desync-repeats=8
  --dpi-desync-split-seqovl-pattern="$FAKE/tls_clienthello_www_google_com.bin"
  --dpi-desync-fake-tls="$FAKE/tls_clienthello_www_google_com.bin"

  --new

  # 4. TCP 443 Google list
  --filter-tcp=443
  --hostlist="$LISTS/list-google.txt"
  --ip-id=zero
  --dpi-desync=hostfakesplit
  --dpi-desync-fooling=ts
  --dpi-desync-hostfakesplit-mod=host=www.google.com

  --new

  # 5. TCP 80/443 general/cloudflare
  --filter-tcp=80,443
  --hostlist="$LISTS/list-general.txt"
  --hostlist="$LISTS/list-general-user.txt"
  --hostlist-exclude="$LISTS/list-exclude.txt"
  --hostlist-exclude="$LISTS/list-exclude-user.txt"
  --ipset-exclude="$LISTS/ipset-exclude.txt"
  --ipset-exclude="$LISTS/ipset-exclude-user.txt"
  --dpi-desync=fake,multisplit
  --dpi-desync-split-seqovl=664
  --dpi-desync-split-pos=1
  --dpi-desync-fooling=ts
  --dpi-desync-repeats=8
  --dpi-desync-split-seqovl-pattern="$FAKE/tls_clienthello_www_sferum_ru.bin"
  --dpi-desync-fake-tls="$FAKE/stun.bin"
  --dpi-desync-fake-tls="$FAKE/tls_clienthello_www_sferum_ru.bin"
  --dpi-desync-fake-http="$FAKE/tls_clienthello_www_sferum_ru.bin"

  --new

  # 6. UDP 443 по ipset-all
  --filter-udp=443
  --ipset="$LISTS/ipset-all.txt"
  --hostlist-exclude="$LISTS/list-exclude.txt"
  --hostlist-exclude="$LISTS/list-exclude-user.txt"
  --ipset-exclude="$LISTS/ipset-exclude.txt"
  --ipset-exclude="$LISTS/ipset-exclude-user.txt"
  --dpi-desync=fake
  --dpi-desync-repeats=11
  --dpi-desync-fake-quic="$FAKE/quic_initial_www_google_com.bin"

  --new

  # 7. TCP 80/443/8443 по ipset-all
  --filter-tcp=80,443,8443
  --ipset="$LISTS/ipset-all.txt"
  --hostlist-exclude="$LISTS/list-exclude.txt"
  --hostlist-exclude="$LISTS/list-exclude-user.txt"
  --ipset-exclude="$LISTS/ipset-exclude.txt"
  --ipset-exclude="$LISTS/ipset-exclude-user.txt"
  --dpi-desync=fake,multisplit
  --dpi-desync-split-seqovl=664
  --dpi-desync-split-pos=1
  --dpi-desync-fooling=ts
  --dpi-desync-repeats=8
  --dpi-desync-split-seqovl-pattern="$FAKE/tls_clienthello_www_sferum_ru.bin"
  --dpi-desync-fake-tls="$FAKE/stun.bin"
  --dpi-desync-fake-tls="$FAKE/tls_clienthello_www_sferum_ru.bin"
  --dpi-desync-fake-http="$FAKE/tls_clienthello_www_sferum_ru.bin"
)
