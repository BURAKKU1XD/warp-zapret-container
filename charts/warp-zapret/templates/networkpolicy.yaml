{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "warp-zapret.fullname" . }}
  labels:
    {{- include "warp-zapret.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "warp-zapret.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 8888
          protocol: TCP
        - port: 1080
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
