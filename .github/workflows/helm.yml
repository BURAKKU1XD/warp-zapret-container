name: Helm chart

on:
  push:
    paths:
      - "charts/**"
      - "tests/helm/**"
      - "config/strategies/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - "tests/helm/**"
      - "config/strategies/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Helm into runner temporary storage
        env:
          HELM_VERSION: v3.19.0
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/helm"
          mkdir -p "$directory"
          cd "$directory"
          archive="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://get.helm.sh/$archive"
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $archive" \
            | sha256sum --check
          tar -xzf "$archive" linux-amd64/helm
          echo "$directory/linux-amd64" >> "$GITHUB_PATH"
      - name: Install chart test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Lint and test rendered manifests without cluster access
        run: python -m unittest discover -s tests/helm -v
