name: CI and GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: warp-zapret1-container-warp-zapret1:latest

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Enable kernel modules for isolated NFQUEUE tests
        run: |
          sudo modprobe nfnetlink_queue
          sudo modprobe xt_connbytes
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build test image (no WARP registration)
        id: build
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Export the tested image, not a rebuild
        id: export
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          image_id="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/warp-image.tar" "$LOCAL_IMAGE"
      - name: Pass tested image to publish job
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/warp-image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/ghcr-docker
    steps:
      - name: Download this run's tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load and verify image identity
        id: load
        env:
          TESTED_IMAGE_ID: ${{ needs.test.outputs.image_id }}
        run: |
          docker load --input "$RUNNER_TEMP/warp-image.tar"
          actual_id="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          test -n "$TESTED_IMAGE_ID"
          test "$actual_id" = "$TESTED_IMAGE_ID"
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Prepare GHCR tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tags=("$image:sha-$GITHUB_SHA")
          case "$GITHUB_REF" in
            refs/heads/main)
              tags+=("$image:latest")
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] ||
                [ "${#version}" -gt 128 ]; then
                echo "Expected a tag such as v1.2.3 or v1.2.3-rc.1" >&2
                exit 1
              fi
              tags+=("$image:$version")
              ;;
            *)
              echo "Publishing is allowed only from main or a version tag" >&2
              exit 1
              ;;
          esac
          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with the scoped workflow token
        id: login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push tested image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
            printf 'Published `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
